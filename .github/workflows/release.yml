# Builds installers for Windows and macOS. macOS can only be packaged on a Mac,
# so both run on GitHub's hosted runners. Push a tag like `v0.1.0` to publish a release,
# or start it manually (Actions → Release → Run workflow) to just get the build artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # The repo's .npmrc points the cache at D:\ for local work; runners use their temp dir.
  npm_config_cache: ${{ github.workspace }}/../npm-cache
  ELECTRON_CACHE: ${{ github.workspace }}/../electron-cache

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci

      # npm installs koffi's native binary only for the runner's own CPU;
      # the macOS build ships both Apple Silicon and Intel apps, so fetch both.
      - name: koffi binaries for both Mac architectures
        if: runner.os == 'macOS'
        run: |
          V=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/koffi/package.json','utf8')).version")
          npm install --no-save --force @koromix/koffi-darwin-arm64@$V @koromix/koffi-darwin-x64@$V

      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      # Not notarized yet: needs an Apple Developer account (CSC_LINK, APPLE_ID secrets).
      # Ad-hoc signing ("-") is enough for the app to run after "Open" in Finder.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never -c.mac.identity=-
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v5
        with:
          name: linky-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
